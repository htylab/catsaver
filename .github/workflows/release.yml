name: release

# Manual release: Actions tab → "release" → "Run workflow", enter a version
# (e.g. 1.2.0). Builds and tests the chosen branch, then creates the tag
# v<version> and a GitHub Release with CatSaver.exe and CatSaver-Setup.exe.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (the tag will be v1.2.0)"
        required: true
      notes:
        description: "Release notes (optional; the change list is added automatically)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        shell: pwsh
        run: |
          $v = "$env:VERSION".Trim().TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.0 (got '$env:VERSION')." }
          if (git tag --list "v$v") { throw "Tag v$v already exists. Pick a new version." }
          "VERSION=$v" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test + build exe + installer
        shell: pwsh
        run: ./build.ps1 -Test -Installer -Version $env:VERSION

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: CatSaver ${{ env.VERSION }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/publish/CatSaver.exe
            artifacts/CatSaver-Setup.exe
