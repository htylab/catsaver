name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build exe + installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          ./build.ps1 -Test -Installer -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: CatSaver
          path: |
            artifacts/publish/CatSaver.exe
            artifacts/CatSaver-Setup.exe

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/CatSaver.exe
            artifacts/CatSaver-Setup.exe
